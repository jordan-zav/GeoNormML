name: Prepare or publish PyPI package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (requires an explicit version tag and Trusted Publisher setup)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geonormml-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: constraints-py311.txt
      - name: Verify publication ref before running the release build
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if os.environ['PUBLISH'] == 'true':
              assert os.environ['RELEASE_REF'] == 'refs/tags/v' + version, 'Publish only from the matching version tag'
          PY
      - run: python -m pip install -c constraints-py311.txt -e '.[dev]' build twine
      - run: python -m pip check
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/geonormml-*
      - run: python scripts/check_distribution.py dist
      - name: Test the public source distribution
        run: python scripts/check_source_distribution.py dist --extract-to "${{ runner.temp }}/geonormml-source"
      - run: 'python -m pip download --no-deps --only-binary=:all: geonormpy==1.1.0 --dest dist'
      - name: Test both real wheels outside their source trees
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          ml, = Path('dist').glob('geonormml-*.whl')
          engine, = Path('dist').glob('geonormpy-*.whl')
          subprocess.run([sys.executable, 'scripts/check_installed_pair.py',
                          '--ml-wheel', str(ml), '--engine-wheel', str(engine)], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: geonormml-distributions
          path: |
            dist/geonormml-*.whl
            dist/geonormml-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: geonormml-checksums
          path: dist/SHA256SUMS.txt

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geonormml/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geonormml-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
