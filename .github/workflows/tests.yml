name: GeoNormML checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: constraints-py311.txt
      - name: Install the released normative engine and research package
        run: python -m pip install -c constraints-py311.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src scripts tests
      - name: Test the suite including real CIPW to prediction integration
        run: python -m pytest -q
      - name: Build the research package and download the released engine wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/geonormml-*
          python scripts/check_distribution.py dist
          python scripts/check_source_distribution.py dist --extract-to "${{ runner.temp }}/geonormml-source"
          python -m pip download --no-deps --only-binary=:all: geonormpy==1.1.0 --dest dist
      - name: Verify both wheels outside their source trees
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          ml, = Path('dist').glob('geonormml-*.whl')
          engine, = Path('dist').glob('geonormpy-*.whl')
          subprocess.run([sys.executable, 'scripts/check_installed_pair.py',
                          '--ml-wheel', str(ml), '--engine-wheel', str(engine)], check=True)
          PY
      - name: Install and exercise the actual application in an isolated environment
        run: |
          python -m venv --system-site-packages "${{ runner.temp }}/geonormml-app-env"
          "${{ runner.temp }}/geonormml-app-env/bin/python" -m pip install --no-deps --ignore-installed dist/geonormml-*.whl dist/geonormpy-*.whl
          python scripts/check_installed_app.py --python "${{ runner.temp }}/geonormml-app-env/bin/python" --output "${{ runner.temp }}/geonormml-app-check"
      - uses: actions/upload-artifact@v4
        with:
          name: geonormml-application-check
          path: ${{ runner.temp }}/geonormml-app-check/installed-app-results.json
