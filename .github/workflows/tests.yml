name: GeoNormML checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: constraints-py311.txt
      - run: python -m pip install -c constraints-py311.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
