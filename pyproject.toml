[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "geonormml"
version = "0.1.0"
description = "Machine learning pipeline for petrographic rock classification using geochemical data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.1",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "geopandas>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "shap>=0.44",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
