[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geonormml"
version = "0.1.0"
description = "Machine learning pipeline for petrographic rock classification using geochemical data"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.7,<1.8",
    "xgboost>=3.2,<3.3",
    "geopandas>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "shap>=0.48,<0.51",
    "joblib>=1.3",
]

[project.optional-dependencies]
research = [
    "catboost==1.2.10",
]
posters = [
    "python-pptx>=1.0",
    "qrcode>=7.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
