[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geonormml"
version = "0.1.0"
description = "Machine learning pipeline for petrographic rock classification using geochemical data"
readme = "docs/PYPI_README.md"
authors = [{name = "Jordan Angel Luciano Zavaleta Reyes", email = "jordanzav@gisgeo.dev"}]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
keywords = ["geochemistry", "petrology", "cipw", "machine-learning", "rock-classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "geonormpy==1.1.0",
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.7,<1.8",
    "xgboost>=3.2,<3.3",
    "geopandas>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "shap>=0.48,<0.51",
    "joblib>=1.3",
]

[project.optional-dependencies]
research = [
    "catboost==1.2.10",
]
posters = [
    "python-pptx>=1.0",
    "qrcode>=7.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/jordan-zav/GeoNormML"
Repository = "https://github.com/jordan-zav/GeoNormML"
Issues = "https://github.com/jordan-zav/GeoNormML/issues"
Documentation = "https://github.com/jordan-zav/GeoNormML/blob/main/docs/STATUS.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
